name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: 后端（含 Testcontainers E2E）
    runs-on: ubuntu-latest   # GitHub runner 自带 Docker，Testcontainers E2E 将真实运行
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 单测 + 端到端集成测试(真实 MySQL 容器 + Flyway 全量)
        working-directory: backend
        run: mvn -B test

  frontend:
    name: 前端（构建 + Vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 单元/组件测试
        working-directory: frontend
        run: npm run test
      - name: 构建
        working-directory: frontend
        run: npm run build

  engine:
    name: Python 校验引擎
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pytest
      - name: 运行测试
        run: python -m pytest -q
