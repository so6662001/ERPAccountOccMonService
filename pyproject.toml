[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-acc-monitor"
version = "0.1.0"
description = "ERP 账务正确性监测服务：通过声明式约束检查与基线回归对比，守住账务数据正确性"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
erp-acc-monitor = "erp_acc_monitor.cli:main"

[tool.setuptools]
packages = ["erp_acc_monitor", "erp_acc_monitor.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
