server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: puxun-data-monitor-platform
  # 平台库（写）—— 与业务库（只读）严格隔离。口令用环境变量注入。
  datasource:
    url: jdbc:mysql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:3306}/${PLATFORM_DB_NAME:puxun_monitor}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PLATFORM_DB_USER:root}
    password: ${PLATFORM_DB_PWD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: platform-pool
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

# 平台安全配置
platform:
  security:
    jwt:
      secret: ${JWT_SECRET:please-change-this-to-a-long-random-secret-key-32bytes-min}
      access-ttl-minutes: 120
      refresh-ttl-days: 7
    # 首次启动自动创建的管理员（仅当不存在时）
    bootstrap-admin:
      enabled: true
      username: admin
      password: ${ADMIN_INIT_PWD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.puxun.monitor: INFO
